services:
  hijri-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nasa-hijri-engine
    ports:
      - "8080:8080"
    volumes:
      - ./pkg/cspice/kernels:/app/pkg/cspice/kernels
    environment:
      - GIN_MODE=release
      - TZ=Asia/Jakarta
    restart: always
